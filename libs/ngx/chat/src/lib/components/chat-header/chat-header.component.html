<mat-toolbar color="primary" class="chat-header-toolbar">
  @if (chatLayoutService.isMobile()) {
    <button
      mat-icon-button
      [matTooltip]="
        chatLayoutService.mobileListOpen() ? 'Back to chat' : 'Show chats'
      "
      (click)="chatLayoutService.toggleList()"
    >
      @if (chatLayoutService.mobileListOpen()) {
        <mat-icon>arrow_back</mat-icon>
      } @else {
        <mat-icon>format_list_bulleted</mat-icon>
      }
    </button>
  }
  <span class="header-title">
    {{
      chatLayoutService.isMobile() && chatLayoutService.mobileListOpen()
        ? 'Chats'
        : chatLayoutService.isMobile() && selectedSession()
          ? selectedSession()?.title
          : 'IDL Agent and ENVI Agent'
    }}
  </span>
  <span class="spacer"></span>
  <button
    mat-icon-button
    [matTooltip]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggleTheme()"
  >
    @if (isDarkMode()) {
      <mat-icon>light_mode</mat-icon>
    } @else {
      <mat-icon>dark_mode</mat-icon>
    }
  </button>
</mat-toolbar>
