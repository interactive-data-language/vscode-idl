<div class="chat-landing">
  <ngx-chat-header />

  <mat-sidenav-container class="chat-container">
    <mat-sidenav
      [mode]="chatLayoutService.isMobile() ? 'over' : 'side'"
      [opened]="
        chatLayoutService.isMobile() ? chatLayoutService.mobileListOpen() : true
      "
      (closed)="chatLayoutService.closeList()"
      class="chat-sidenav"
      [class.chat-sidenav--mobile]="chatLayoutService.isMobile()"
      [class.chat-sidenav--no-anim]="
        chatLayoutService.suppressSidenavAnimation()
      "
    >
      <ngx-chat-sidebar />
    </mat-sidenav>

    <mat-sidenav-content class="chat-main-content">
      <ngx-chat-content />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
