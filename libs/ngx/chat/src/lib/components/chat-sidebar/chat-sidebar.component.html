<div class="sidebar-container">
  <div class="sidebar-header">
    <button
      mat-raised-button
      color="primary"
      class="new-chat-button"
      (click)="createNewChat()"
    >
      <mat-icon>add</mat-icon>
      New Chat
    </button>
  </div>

  <mat-divider />

  <div class="sidebar-scroll-area">
    @if (loading()) {
      <div class="sidebar-empty-state">
        <mat-icon class="spinning-icon">sync</mat-icon>
        <p>Loading chats...</p>
      </div>
    } @else if (sessions().length === 0) {
      <div class="sidebar-empty-state">
        <mat-icon class="empty-icon">chat_bubble_outline</mat-icon>
        <p>No chats yet</p>
      </div>
    } @else {
      <mat-nav-list class="chat-nav-list">
        @for (session of todaySessions(); track session.id) {
          <ngx-chat-sidebar-item
            [session]="session"
            [selected]="selectedSessionId() === session.id"
            (sessionSelected)="selectSession($event)"
            (sessionDeleted)="deleteSession($event)"
          />
        }
        @if (olderSessions().length > 0) {
          <div class="older-section">
            <button
              type="button"
              class="older-toggle-btn"
              [attr.aria-expanded]="olderOpen()"
              (click)="toggleOlder()"
            >
              <mat-icon class="toggle-icon">{{
                olderOpen() ? 'expand_less' : 'expand_more'
              }}</mat-icon>
              <span class="toggle-text"
                >Yesterday & Older ({{ olderSessions().length }})</span
              >
            </button>
            @if (olderOpen()) {
              @for (session of olderSessions(); track session.id) {
                <ngx-chat-sidebar-item
                  [session]="session"
                  [selected]="selectedSessionId() === session.id"
                  (sessionSelected)="selectSession($event)"
                  (sessionDeleted)="deleteSession($event)"
                />
              }
            }
          </div>
        }
      </mat-nav-list>
    }
  </div>
</div>
