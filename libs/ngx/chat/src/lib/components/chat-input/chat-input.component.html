<div class="chat-input-container">
  <div class="composer" [class.generating]="isDisabled()">
    <textarea
      class="composer-textarea"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="8"
      [(ngModel)]="inputText"
      (keypress)="onKeyPress($event)"
      placeholder="Type your message here (Enter to send, Shift+Enter for new line)"
      [disabled]="isDisabled()"
    ></textarea>

    <div class="composer-toolbar">
      <div class="selectors-row">
        <ngx-chat-instructions-selector />
        <ngx-chat-model-selector />
      </div>

      <div class="send-column">
        <button
          mat-icon-button
          class="send-button"
          (click)="isDisabled() ? stopMessage() : sendMessage()"
          [disabled]="!isDisabled() && !inputText().trim()"
          [attr.aria-label]="isDisabled() ? 'Stop generating' : 'Send message'"
        >
          <mat-icon>{{ isDisabled() ? 'stop' : 'arrow_upward' }}</mat-icon>
        </button>
        <ngx-chat-token-usage-indicator />
      </div>
    </div>
  </div>
</div>
