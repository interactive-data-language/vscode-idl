<mat-list-item (click)="onSelect()" [activated]="selected()">
  <div matListItemTitle>
    {{ session().title }}
  </div>
  <div matListItemLine class="created-at">
    {{ session().createdAt | date: 'short' }}
  </div>
  <button
    mat-icon-button
    matListItemMeta
    class="delete-button"
    aria-label="Delete chat"
    (click)="onDelete($event)"
  >
    <mat-icon>delete</mat-icon>
  </button>
</mat-list-item>
