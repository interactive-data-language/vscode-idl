<mat-list-item
  class="chat-session-item"
  (click)="onSelect()"
  [activated]="selected()"
>
  <div matListItemTitle class="chat-title">
    {{ session().title }}
  </div>
  <div matListItemLine class="last-message-at">
    {{ session().lastMessageAt | date: 'short' }}
  </div>
  <button
    mat-icon-button
    matListItemMeta
    class="delete-button"
    aria-label="Delete chat"
    (click)="onDelete($event)"
  >
    <mat-icon>delete</mat-icon>
  </button>
</mat-list-item>
