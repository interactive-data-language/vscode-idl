@if (content()) {
  <div class="message-wrapper thinking-message">
    <mat-card class="message-card">
      <mat-card-content class="thinking-card-content">
        <details
          class="thinking-details"
          (toggle)="body.scrollTop = body.scrollHeight"
        >
          <summary class="thinking-header">
            <mat-icon class="thinking-icon">psychology</mat-icon>
            <span class="thinking-label">{{
              isInProgress() ? 'Thinking...' : 'Thought'
            }}</span>
            <mat-icon class="thinking-chevron">expand_more</mat-icon>
          </summary>

          <div #body class="thinking-body">
            <ngx-chat-markdown-renderer
              [data]="content()"
              (ready)="body.scrollTop = body.scrollHeight"
            />
          </div>
        </details>
      </mat-card-content>
    </mat-card>
  </div>
}
